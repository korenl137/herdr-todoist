[package]
name = "herdr-todoist"
version = "0.2.0"
edition = "2021"
description = "Todoist task picker core for herdr-app: loads tasks through the td CLI, keeps a cart and its history"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
